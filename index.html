<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181B%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%233BC48A%27/%3E%3C/svg%3E">
<title>Pauta Comemorativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única centralizada. Topo mínimo, barra de criação rápida, abas Lista/Quadro/Calendário.
   A lista ainda se lê como planilha (colunas alinhadas, edição na célula), sem grade vertical. */
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --line:#E8E8E5; --soft:#F3F3F1; --ink:#18181B; --muted:#66666E; --faint:#A1A1A8;
  --accent:#1F7A55; --accent-ink:#FFFFFF; --accent-soft:#E5F2EB;
  --info:#2563EB; --rev:#7C3AED; --ok:#15803D; --warn:#B45309; --bad:#DC2626; --bad-soft:#FDECEC;
  --t-feriado:#DC2626; --t-comercial:#2563EB; --t-setor:#1F7A55; --t-regional:#C2410C; --t-campanha:#7C3AED; --t-data:#8A8A92; --t-propria:#18181B;
  --pop:0 12px 32px rgba(17,17,20,.14),0 2px 6px rgba(17,17,20,.06); --scrim:rgba(17,17,20,.28);
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0D; --surface:#151517; --line:#27272B; --soft:#1C1C1F; --ink:#EDEDEF; --muted:#A1A1A9; --faint:#6E6E76;
    --accent:#3BC48A; --accent-ink:#06210F; --accent-soft:#11291E;
    --info:#60A5FA; --rev:#A78BFA; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --bad-soft:#2B1416;
    --t-feriado:#F87171; --t-comercial:#60A5FA; --t-setor:#3BC48A; --t-regional:#FB923C; --t-campanha:#A78BFA; --t-data:#8E8E96; --t-propria:#EDEDEF;
    --pop:0 14px 36px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0D; --surface:#151517; --line:#27272B; --soft:#1C1C1F; --ink:#EDEDEF; --muted:#A1A1A9; --faint:#6E6E76;
  --accent:#3BC48A; --accent-ink:#06210F; --accent-soft:#11291E;
  --info:#60A5FA; --rev:#A78BFA; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --bad-soft:#2B1416;
  --t-feriado:#F87171; --t-comercial:#60A5FA; --t-setor:#3BC48A; --t-regional:#FB923C; --t-campanha:#A78BFA; --t-data:#8E8E96; --t-propria:#EDEDEF;
  --pop:0 14px 36px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55); color-scheme:dark;
}
html{box-sizing:border-box;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 120px;display:flex;flex-direction:column;gap:18px}

/* Topo */
.top{display:flex;align-items:center;gap:12px}
.marca{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.marca h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.02em}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="vivo"] i{background:var(--ok)}
.sync[data-s="salvando"] i{background:var(--warn);animation:pulsa 1s ease-in-out infinite}
.sync[data-s="erro"] i{background:var(--bad)}
@keyframes pulsa{50%{opacity:.3}}
.eu{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;font-weight:500}
.eu:hover{border-color:var(--faint)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pc,var(--faint));color:#fff;font:600 12px/1 var(--f-ui);flex:none;border:0;padding:0}
.av.lg{width:44px;height:44px;font-size:17px}
.av.vazio{background:transparent;color:var(--faint);border:1.5px dashed var(--line)}
.av.naovista{outline:2px dashed var(--pc,var(--faint));outline-offset:2px}

/* Criação rápida */
.qa{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.qa-linha{display:flex;align-items:center;gap:8px}
.qa-linha input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none}
.qa-linha input::placeholder{color:var(--faint)}
.kbd{font:500 11px var(--f-mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.qa-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
.qchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12.5px;animation:entra .18s ease-out}
.qchip:hover{border-color:var(--faint)}
.qchip.falta{background:transparent;border-style:dashed;color:var(--muted)}
.qchip .av{width:18px;height:18px;font-size:10px}
@keyframes entra{from{opacity:0;transform:translateY(3px)}}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover:not(:disabled){opacity:.88}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.perigo{color:var(--bad)}
.btn:disabled{opacity:.45}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:500;font-size:13px}

/* Barra de abas e filtros */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 0;margin:-8px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.filtros{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-left:auto}
.fchip{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.fchip:hover{color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fchip .n{font:500 11px var(--f-mono);margin-left:5px;opacity:.7}
.fchip.alerta .n{color:var(--bad);opacity:1}
.fchip[aria-pressed="true"].alerta .n{color:inherit}
.filtros select,.filtros input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;min-width:0}
.filtros input{width:150px}

/* Próximas datas */
.faixa{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.faixa::-webkit-scrollbar{display:none}
.dchip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px}
.dchip:hover{border-color:var(--faint)}
.dchip .q{color:var(--muted);font:500 11.5px var(--f-mono)}
.dchip .q.perto{color:var(--warn)}
.cob{display:inline-flex;gap:2px;padding:3px 6px;border-radius:999px;background:var(--soft)}
.cob i{width:7px;height:7px;border-radius:2px;border:1.5px solid var(--c);opacity:.9}
.cob i.on{background:var(--c)}

/* Lista */
.lista{--cols:30px minmax(220px,1fr) 136px 52px 92px 168px 112px 34px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lh,.row{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:10px;padding:0 10px 0 12px}
.lh{height:36px;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.lh button{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;text-align:left}
.lh button:hover{color:var(--ink)}
.lh .on{color:var(--ink)}
.grupo{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 54px;font-size:12px;font-weight:600;color:var(--muted)}
.grupo .n{font:500 11px var(--f-mono);color:var(--faint)}
.grupo.atrasadas{color:var(--bad)}
.row{min-height:54px;border-top:1px solid var(--line);transition:background .12s}
.grupo+.row{border-top-color:transparent}
.row:hover{background:var(--soft)}
.row.nova{background:var(--accent-soft)}
.row.feita .tit{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.row.chegou{animation:chega .9s ease-out}
@keyframes chega{from{background:var(--accent-soft)}}
.c{min-width:0;display:flex;align-items:center}
.c-tit{flex-direction:column;align-items:flex-start;padding:7px 0}
.tit{border:0;background:none;padding:0;text-align:left;font-size:14px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tit:hover:not(:disabled){text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.tit-in{width:100%;border:1px solid var(--accent);border-radius:6px;padding:3px 6px;font-size:14px;font-weight:500;background:var(--surface);outline:none}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:6px}
.badge{font:600 10px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:3px 5px}
.cel{border:0;background:none;padding:4px 6px;margin-left:-6px;border-radius:6px;font-size:13px;display:inline-flex;align-items:center;gap:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cel:hover:not(:disabled){background:var(--soft)}
.row:hover .cel:hover:not(:disabled){background:var(--line)}
.cel.vazia{color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.stdot{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;background:transparent;padding:0;display:grid;place-items:center;color:var(--faint);flex:none;transition:transform .12s}
.stdot:hover:not(:disabled){transform:scale(1.12)}
.stdot.st-fazendo{color:var(--info);box-shadow:inset 0 0 0 3px var(--surface);background:currentColor}
.stdot.st-revisao{color:var(--rev);background:conic-gradient(currentColor 0 50%,transparent 0)}
.stdot.st-postado{color:var(--ok);background:currentColor}
.stdot.st-postado::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translate(0,-1px) rotate(45deg)}
.cd{border:0;background:none;padding:4px 6px;margin-left:-6px;border-radius:6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:left}
.cd:hover:not(:disabled){background:var(--soft)}
.cd-b{display:block;width:100%;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.cd-b i{display:block;height:100%;width:0;background:currentColor;transition:width .9s linear}
.cd-ok{color:var(--ok)} .cd-24{color:var(--warn)} .cd-6{color:var(--bad)} .cd-atr{color:var(--bad)}
.cd-ent{color:var(--muted)} .cd-ent-atr{color:var(--warn)} .cd-sem{color:var(--faint)}
.cd-6 .cd-t::before,.cd-atr .cd-t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:pulsa 1s steps(2) infinite}
.sw{border:0;background:none;padding:4px 8px;margin-left:-8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--faint)}
.sw:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.sw .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:7px;border:1.5px solid currentColor}
.sw.tem{color:var(--muted)}
.sw.on{color:var(--bad)}
.sw.on .ic{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mais{border:0;background:none;width:30px;height:30px;border-radius:8px;color:var(--faint);font-size:18px;line-height:1}
.mais:hover{background:var(--soft);color:var(--ink)}
.vazio{padding:44px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.vazio h2{margin:0;font-size:16px;font-weight:600}
.vazio p{margin:0;color:var(--muted);max-width:46ch}
.vazio .acoes{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}

/* Quadro */
.quadro{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;transition:box-shadow .12s,background .12s}
.col.over{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.col header{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-size:13px}
.col header .stdot{width:14px;height:14px}
.col header .n{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;transition:box-shadow .12s,transform .12s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.card.drag{opacity:.45;transform:rotate(1.5deg)}
.card.nova{box-shadow:inset 3px 0 0 var(--accent)}
.card-top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.card-top .av{width:20px;height:20px;font-size:10px;margin-left:auto}
.card-tit{margin:0;font-size:13.5px;font-weight:500;line-height:1.35}
.card-foot{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.card-foot .oc{font-family:var(--f-ui);color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vazio-col{margin:6px 4px;font-size:12.5px;color:var(--faint)}

/* Calendário */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-head h2{margin:0 6px;font-size:18px;font-weight:600;min-width:170px;text-transform:capitalize}
.ico{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;font-size:15px;line-height:1}
.ico:hover{border-color:var(--faint)}
.legenda{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.tdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--tc,var(--faint))}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-grid .dn{padding:8px 10px;font-size:11.5px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.dia{min-height:112px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;transition:background .12s}
.dia:nth-child(7n){border-right:0}
.dia:hover{background:var(--soft)}
.dia.fora{background:var(--bg)}
.dia.fora .num{color:var(--faint)}
.dia.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.num{font:500 12.5px var(--f-mono);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.dia.hoje .num{background:var(--ink);color:var(--bg)}
.lbl{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.25;color:var(--ink);min-width:0}
.lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk{border:0;border-left:3px solid var(--ec,var(--faint));background:var(--soft);border-radius:4px;padding:2px 6px;font-size:11.5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.tk:hover{background:var(--line)}
.tk.feita{color:var(--muted);text-decoration:line-through}
.mais-n{font-size:11px;color:var(--muted);padding-left:4px}
.pontos{display:none;gap:3px;flex-wrap:wrap}
.pontos i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--faint))}
.pdia{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.pdia header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pdia h3{margin:0;font-size:16px;font-weight:600}
.pdia header .btn{margin-left:auto}
.pd-data{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pd-nome{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500}
.pd-nome small{color:var(--muted);font-weight:400}
.tag{font:600 10px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--tc,var(--muted));border:1px solid currentColor;border-radius:4px;padding:3px 5px;opacity:.85}
.x{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.cobs{display:flex;flex-wrap:wrap;gap:6px}
.cobc{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.cobc:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.cobc.tem{border-style:solid;background:var(--soft);color:var(--ink)}
.pd-lista{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.pd-lista h4{margin:0 0 2px;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mini{display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 8px;margin:0 -8px;border-radius:8px;text-align:left;font-size:13.5px}
.mini:hover{background:var(--soft)}
.mini .cd-t{margin-left:auto;font:500 12px var(--f-mono)}
.dp-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.dp-form input[type="text"],.dp-form select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0}
.dp-form input[type="text"]{flex:1 1 200px}

/* Popover */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:5px;min-width:200px;max-width:min(320px,calc(100vw - 24px));max-height:min(420px,calc(100vh - 24px));overflow:auto;animation:entra .12s ease-out}
.mi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px}
.mi:hover,.mi:focus-visible{background:var(--soft);outline:none}
.mi small{color:var(--muted);margin-left:auto;font-size:12px}
.mi.sel{font-weight:600}
.mi.sel::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:600}
.mi.sel small{display:none}
.mi .av{width:20px;height:20px;font-size:10px}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.pop .campo-pop{padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px}
.pop .campo-pop span{font-size:11.5px;color:var(--muted)}
.pop input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:13.5px;width:100%}

/* Painel lateral */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:70;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:var(--pop)}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px 20px 8px}
.dr-head h2{margin:0;font-size:13px;font-weight:500;color:var(--muted);flex:1}
.dr-corpo{flex:1;overflow:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:18px}
.dr-pe{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.dr-pe .esp{flex:1}
.salvo{font-size:12px;color:var(--muted)}
.t-titulo{border:0;background:transparent;font-size:21px;font-weight:600;letter-spacing:-.01em;padding:4px 0;width:100%;outline:none;border-bottom:1px solid transparent}
.t-titulo:focus{border-bottom-color:var(--accent)}
.campo{display:flex;flex-direction:column;gap:7px;min-width:0}
.campo>span,.rot{font-size:12px;font-weight:500;color:var(--muted)}
.campo input,.campo select,.campo textarea{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 11px;font-size:14px;width:100%}
.campo textarea{resize:vertical;min-height:72px;line-height:1.45}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duas>*{min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s}
.opt span:hover{border-color:var(--faint)}
.opt input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.opt .av{width:18px;height:18px;font-size:10px}
.atalhos{display:flex;gap:6px;flex-wrap:wrap}
.atalhos button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px}
.atalhos button:hover{border-color:var(--accent);color:var(--accent)}
.dica{font-size:12.5px;color:var(--muted)}
.relogios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rel .rot{font-size:11.5px}
.rel .big{font:600 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rel .btn{align-self:flex-start}
.meta{font-size:12.5px;color:var(--muted)}
.aj-sec{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.aj-sec:last-child{border-bottom:0}
.aj-sec h3{margin:0;font-size:14px;font-weight:600}
.aj-linha{display:flex;align-items:center;gap:8px}
.aj-linha input[type="text"]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;font-size:13.5px}
.aj-linha input[type="color"]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--surface);flex:none}

/* Janela central */
.modal{position:fixed;inset:0;z-index:90;background:var(--scrim);display:grid;place-items:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mcard{background:var(--surface);border-radius:16px;box-shadow:var(--pop);padding:26px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;animation:entra .2s ease-out}
.mcard h2{margin:0;font-size:18px;font-weight:600}
.mcard p{margin:0;color:var(--muted)}
.pessoas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pessoa-btn{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 10px;font-weight:600;transition:border-color .12s,transform .12s}
.pessoa-btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.pessoa-btn small{font-weight:400;color:var(--muted)}
.mcard input{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px;width:100%;background:var(--surface)}
.mcard ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.erro{color:var(--bad);font-size:13px}

/* Cronômetro flutuante e avisos */
.pill{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--pop);max-width:calc(100vw - 32px);animation:entra .2s ease-out}
.pill .rec{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulsa 1.2s ease-in-out infinite;flex:none}
.pill .tempo{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.pill .ptit{border:0;background:none;color:inherit;opacity:.75;font-size:13px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0}
.pill .pbtn{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.toasts{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;box-shadow:var(--pop);max-width:min(380px,calc(100vw - 36px));display:flex;align-items:center;gap:12px;animation:entra .18s ease-out}
.toast button{border:0;background:none;color:var(--accent);font-weight:600;padding:0;white-space:nowrap}
.aviso{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--muted)}

@media (max-width:860px){
  .lh{display:none}
  .row{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 12px;min-height:0}
  .c-st{order:0}
  .c-tit{flex:1 1 calc(100% - 80px);order:1;padding:0}
  .c-mais{order:2}
  .c-emp,.c-pes,.c-data,.c-cd,.c-sw{order:3;padding-left:32px}
  .c-pes,.c-data,.c-cd,.c-sw{padding-left:0}
  .c-cd{min-width:150px}
  .grupo{padding-left:12px}
  .filtros{margin-left:0}
}
@media (max-width:640px){
  .wrap{padding-block:14px 110px;gap:14px}
  .marca h1{font-size:18px}
  .eu .nm{display:none}
  .eu{padding-right:3px}
  .filtros input{width:100%;order:9}
  .dia{min-height:58px;padding:4px}
  .dia .lbl,.dia .tk,.dia .mais-n{display:none}
  .dia .pontos{display:flex}
  .cal-grid .dn{padding:6px 4px;text-align:center;letter-spacing:0}
  .duas,.relogios{grid-template-columns:1fr}
  .pill .ptit{max-width:110px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-titulo" aria-hidden="true">
  <div class="dr-head">
    <h2 id="dr-titulo">Demanda</h2>
    <button class="mais" id="dr-fechar" type="button" aria-label="Fechar">✕</button>
  </div>

  <form id="form-tarefa" class="dr-corpo" novalidate>

<div class="modal" id="modal" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const H = 3600e3, D = 24 * H;

}
const lerLS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gravarLS = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* armazenamento opcional */ } };
const p2 = n => String(n).padStart(2, '0');

const diasAte = s => Math.round((deYmd(s) - deYmd(hojeYmd())) / D);
const SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const SEM_LONGA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const fmtDia = s => { const d = deYmd(s); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}`; };

const fmtDiaAno = s => `${fmtDia(s)}/${s.slice(0, 4)}`;
const fmtHora = ms => { const d = new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fmtQuando = ms => { const d = new Date(ms), dia = ymd(d), n = diasAte(dia); return (n === 0 ? 'hoje' : n === 1 ? 'amanhã' : `${SEM[d.getDay()]} ${fmtDia(dia)}`) + ' ' + fmtHora(ms).replace(':00', 'h'); };
const fmtDataHoraAno = ms => { const d = new Date(ms); return `${fmtDiaAno(ymd(d))} ${fmtHora(ms)}`; };
const paraInputDT = ms => ms ? `${ymd(new Date(ms))}T${fmtHora(ms)}` : '';
const deInputDT = s => { if (!s) return null; const t = new Date(s).getTime(); return isNaN(t) ? null : t; };
const quandoTxt = n => n === 0 ? 'hoje' : n === 1 ? 'amanhã' : n < 0 ? `há ${-n} d` : `em ${n} d`;
function relogio(ms) {
  const s = Math.floor(Math.abs(ms) / 1000), d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  if (d >= 7) return `${d}d ${hh}h`;

}
const duracao = ms => { const s = Math.floor(Math.max(0, ms) / 1000); return `${p2(Math.floor(s / 3600))}:${p2(Math.floor(s % 3600 / 60))}:${p2(s % 60)}`; };
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const arred = ms => Math.round(ms / 60000) * 60000;

/* ---------- estado ---------- */
const COLS = ['tarefas', 'empresas', 'equipe', 'datas'];
const S = {
  modo: null, carregado: false, online: false, salvando: 0, somenteLeitura: false,
  tarefas: new Map(), empresas: new Map(), equipe: new Map(), datas: new Map(),

  mes: hojeYmd().slice(0, 7), diaSel: hojeYmd(), dpAberto: false,
  qa: { ov: {} }, drawer: null, editando: null, chegaram: new Set(),
};
const STATUS = [['afazer', 'A fazer'], ['fazendo', 'Fazendo'], ['revisao', 'Revisão'], ['postado', 'Postado']];
const ST = Object.fromEntries(STATUS.map(([v, t], i) => [v, { t, i }]));
const stOk = s => ST[s] ? s : s === 'aprovado' ? 'postado' : 'afazer';
const ENTREGUE = new Set(['revisao', 'postado']);
const FORMATOS = ['Post', 'Carrossel', 'Story', 'Reels', 'Vídeo'];
const TIPOS = { feriado: 'Feriado', comercial: 'Comercial', setor: 'Automotivo', regional: 'Bahia', campanha: 'Campanha', data: 'Data', propria: 'Própria' };

/* ---------- calendário (calculado para qualquer ano) ---------- */
function pascoa(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), hh = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - hh - k) % 7, m = Math.floor((a + 11 * hh + 22 * l) / 451),
    mes = Math.floor((hh + l - 7 * m + 114) / 31), dia = ((hh + l - 7 * m + 114) % 31) + 1;

const enesimo = (y, mes, diaSem, n) => { const d = new Date(y, mes, 1); return new Date(y, mes, 1 + (diaSem - d.getDay() + 7) % 7 + 7 * (n - 1)); };
const somar = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ALIAS = {
  'black-friday': ['black friday', 'black'], pais: ['dia dos pais'], maes: ['dia das maes'], natal: ['natal', 'natalino', 'natalina'],
  namorados: ['namorados'], criancas: ['dia das criancas'], caminhoneiro: ['caminhoneiro', 'caminhoneiros'], mecanico: ['dia do mecanico'],
  motorista: ['dia do motorista', 'sao cristovao'], 'sao-joao': ['sao joao', 'junina', 'junino'], carnaval: ['carnaval'], pascoa: ['pascoa'],

        h('div', { style: 'flex:1;min-width:0' }, h('b', null, me ? nome(me) : 'Ninguém escolhido'), h('div', { class: 'dica' }, me ? (S.equipe.get(me).funcao || '') : 'Escolha quem está usando este aparelho.')),

    h('section', { class: 'aj-sec' }, h('h3', null, 'Avisos e exportação'),

        Notification.permission === 'default' ? h('button', { class: 'btn sm', type: 'button', 'data-acao': 'avisos' }, 'Ligar') : null) : null,
      h('div', { class: 'aj-linha' }, h('span', { class: 'dica', style: 'flex:1' }, 'Baixa as demandas do filtro atual numa planilha que abre no Excel.'), h('button', { class: 'btn sm', type: 'button', 'data-acao': 'csv' }, 'Baixar .csv')),
      S.modo === 'api' && B.senha ? h('div', { class: 'aj-linha' }, h('span', { class: 'dica', style: 'flex:1' }, 'Esquecer a senha da equipe neste aparelho.'), h('button', { class: 'btn sm', type: 'button', 'data-acao': 'sair' }, 'Sair')) : null));
}

/* ---------- janelas: quem é você, senha, configuração ---------- */
let modalTipo = null;

  setTimeout(() => { const f = $('#mcard').querySelector('input,.pessoa-btn,button'); if (f) f.focus(); }, 40);
}
function fecharModal() { $('#modal').hidden = true; modalTipo = null; }

  abrirModal('quem', h('h2', null, 'Quem está usando?'), h('p', null, 'Assim a pauta sabe quais demandas são suas. Fica salvo neste aparelho.'),
    ps.length ? h('div', { class: 'pessoas' }, ps.map(p => h('button', { type: 'button', class: 'pessoa-btn', 'data-quem': p.id }, avatar(p.id, 'lg'), p.nome, p.funcao ? h('small', null, p.funcao) : null)))
      : h('p', null, 'Ninguém na equipe ainda. Feche e adicione as pessoas em Ajustes.'),

}

      h('input', { type: 'password', id: 'senha', autocomplete: 'current-password', 'aria-label': 'Senha da equipe' }),
      erro ? h('p', { class: 'erro' }, erro) : null, h('button', { class: 'btn pri', type: 'submit' }, 'Entrar')));
}
function mostrarSetup(tipo) {

  abrirModal('setup', h('h2', null, tipo === 'sem-banco' ? 'Falta ligar o banco de dados' : 'Não achei o servidor da pauta'),
    tipo === 'sem-banco'

          h('li', null, 'Settings → Environment Variables: crie PAUTA_SENHA com a senha da equipe.'), h('li', null, 'Faça um novo deploy e recarregue esta página.'))]
      : h('p', null, local ? 'Este arquivo precisa ser aberto pelo endereço do Vercel, não direto do computador. O passo a passo está no README.md do repositório.' : 'A rota /api/pauta não respondeu. Confira se a pasta api/ foi junto no deploy.'),
    h('button', { class: 'btn', type: 'button', 'data-acao': 'recarregar' }, 'Tentar de novo'));
}
function aposCarregar() { if (!eu()) mostrarQuem(); checarPrazos(); agendar(); }

/* ---------- cronômetro flutuante, avisos e exportação ---------- */
function pintarPill() {
  const me = eu(), p = $('#pill');
  const t = me ? [...S.tarefas.values()].filter(x => x.rodandoDesde && x.rodandoPor === me).sort((a, b) => b.rodandoDesde - a.rodandoDesde)[0] : null;
  p.hidden = !t; p.dataset.id = t ? t.id : '';
  if (t) { $('#pill-tempo').textContent = duracao(tempoTotal(t, Date.now())); $('#pill-tit').textContent = t.demanda; }
}
function toast(msg, acao, fn) {
  const el = h('div', { class: 'toast', role: 'status' }, h('span', null, msg));
  if (acao && fn) el.append(h('button', { type: 'button', onclick: () => { el.remove(); fn(); } }, acao));
  $('#toasts').append(el);
  setTimeout(() => el.remove(), acao ? 8000 : 4000);
}
function avisar(titulo, corpo, id) {
  toast(`${titulo}: ${corpo}`, id ? 'Abrir' : null, id ? () => abrirTarefa(id) : null);
  try {
    if (document.hidden && window.Notification && Notification.permission === 'granted') {
      const n = new Notification(titulo, { body: corpo, tag: id || titulo });
      n.onclick = () => { window.focus(); if (id) abrirTarefa(id); n.close(); };
    }
  } catch (e) { /* avisos do sistema são opcionais */ }
}
function ativarAvisos() {
  try { Promise.resolve(Notification.requestPermission()).then(() => pintarAjustes(true)); }
  catch (e) { toast('Este navegador não permite avisos.'); }
}
let avisados;
try { avisados = new Set(JSON.parse(lerLS('pauta:avisados') || '[]')); } catch (e) { avisados = new Set(); }
function checarPrazos() {
  const me = eu(); if (!me) return;
  const now = Date.now(); let mudou = false;
  for (const t of S.tarefas.values()) {
    if (t.responsavel !== me || !t.prazo || ENTREGUE.has(stOk(t.status))) continue;
    const r = t.prazo - now, k = t.id + ':' + t.prazo;
    if (r > 0 && r <= H && !avisados.has(k)) { avisados.add(k); mudou = true; avisar('Falta menos de 1 hora', t.demanda, t.id); }
  }
  if (mudou) gravarLS('pauta:avisados', JSON.stringify([...avisados].slice(-200)));
}
async function baixarCsv() {
  const now = Date.now();
  const cab = ['Demanda', 'Empresa', 'Data comemorativa', 'Postagem', 'Formato', 'Quem faz', 'Pedido por', 'Prazo', 'Status', 'Tempo gasto', 'Link', 'Observações'];
  const linhas = listaFiltrada(now).map(t => [t.demanda, S.empresas.get(t.empresaId)?.nome || '', t.ocasiao || '', t.data ? fmtDiaAno(t.data) : '', t.formato || '',
    t.responsavel ? nome(t.responsavel) : '', nome(t.pedidoPor || t.criadoPor), t.prazo ? fmtDataHoraAno(t.prazo) : '', ST[stOk(t.status)].t, duracao(tempoTotal(t, now)), t.link || '', t.obs || '']);
  const esc = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = '﻿' + [cab, ...linhas].map(r => r.map(esc).join(';')).join('\r\n'), arq = `pauta-${hojeYmd()}.csv`;
  if (S.dl) { try { await S.dl.save({ filename: arq, data: csv }); } catch (e) { if (!e || e.code !== 'declined') toast('Não deu para baixar agora.'); } return; }
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), a = h('a', { href: url, download: arq });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function armar(btn, rotulo, fn) {
  if (btn.dataset.armado) { delete btn.dataset.armado; fn(); return; }
  const orig = btn.textContent; btn.dataset.armado = '1'; btn.textContent = rotulo;
  setTimeout(() => { if (btn.isConnected && btn.dataset.armado) { delete btn.dataset.armado; btn.textContent = orig; } }, 4000);
}

/* ---------- relógio, navegação e eventos ---------- */
function tique() {
  const now = Date.now();
  if (tique.dia !== hojeYmd()) { tique.dia = hojeYmd(); agendar(); }
  const raiz = $('#v-' + S.vista);
  for (const el of $$('[data-id]', raiz)) { const t = S.tarefas.get(el.dataset.id); if (t) pintarRelogio(el, t, now); }
  const pid = $('#pill').dataset.id, pt = pid && S.tarefas.get(pid);
  if (pt) $('#pill-tempo').textContent = duracao(tempoTotal(pt, now));
  if (S.drawer) drawerVivo();
  if (now - (tique.ult || 0) > 30000) { tique.ult = now; checarPrazos(); if (!POP && !arrastando) agendar(); }
}
const VISTAS = ['lista', 'quadro', 'calendario'];
function irPara(v) { if (!VISTAS.includes(v)) return; S.vista = v; gravarLS('pauta:vista', v); fecharPop(); agendar(); try { if (location.hash !== '#' + v) location.hash = v; } catch (e) { /* hash opcional */ } }
function rota() { const v = location.hash.slice(1); if (VISTAS.includes(v) && v !== S.vista) { S.vista = v; fecharPop(); agendar(); } }
function ligarUI() {
  $('#filtros').replaceChildren(h('span', { id: 'fchips', style: 'display:contents' }),
    h('select', { id: 'f-emp', 'aria-label': 'Filtrar por empresa' }), h('input', { id: 'f-busca', type: 'search', placeholder: 'Buscar', 'aria-label': 'Buscar demanda' }));
  $('#fchips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { S.filtro = b.dataset.f; agendar(); } });
  $('#f-emp').addEventListener('change', e => { S.fEmp = e.target.value; qaChave = ''; agendar(); });
  $('#f-busca').addEventListener('input', e => { S.busca = e.target.value; agendar(); });
  $$('.seg [data-v]').forEach(b => b.addEventListener('click', () => irPara(b.dataset.v)));

  const qi = $('#qa-input');
  qi.addEventListener('input', () => { if (!qi.value.trim()) S.qa.ov = {}; pintarQa(); });
  qi.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); criarRapido(e.shiftKey); }
    else if (e.key === 'Escape') { qi.value = ''; S.qa.ov = {}; pintarQa(); qi.blur(); }
  });
  $('#qa-criar').addEventListener('click', () => criarRapido(false));
  $('#qa-chips').addEventListener('click', e => { const b = e.target.closest('[data-qa]'); if (b) chipQa(b.dataset.qa, b); });
  $('#b-eu').addEventListener('click', abrirAjustes);
  $('#faixa').addEventListener('click', e => { const b = e.target.closest('[data-dia]'); if (b) { S.diaSel = b.dataset.dia; S.mes = S.diaSel.slice(0, 7); S.dpAberto = false; irPara('calendario'); } });

  $('#lista').addEventListener('click', e => {
    const s = e.target.closest('[data-sort]');
    if (s) { const k = s.dataset.sort; S.ordem = S.ordem.col === k ? { col: k, dir: -S.ordem.dir } : { col: k, dir: 1 }; agendar(); return; }
    const row = e.target.closest('.row'), t = row && S.tarefas.get(row.dataset.id); if (!t) return;
    const b = e.target.closest('button,input');
    if (!b) return abrirTarefa(t.id);
    if (b.dataset.menu) return menuCampo(b.dataset.menu, t, b);
    if (b.dataset.edit) return editarTitulo(b, t);
    if (b.dataset.sw) return alternarCrono(t);
    if (b.dataset.abrir) return abrirTarefa(t.id);
  });

  const q = $('#quadro');
  q.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) abrirTarefa(c.dataset.id); });
  q.addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); abrirTarefa(c.dataset.id); } });
  q.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; arrastando = c.dataset.id; e.dataTransfer.setData('text/plain', arrastando); e.dataTransfer.effectAllowed = 'move'; requestAnimationFrame(() => c.classList.add('drag')); });
  q.addEventListener('dragend', () => { arrastando = null; $$('.drag,.over', q).forEach(x => x.classList.remove('drag', 'over')); agendar(); });
  q.addEventListener('dragover', e => { const col = e.target.closest('.col'); if (!col || !arrastando) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; $$('.col.over', q).forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
  q.addEventListener('dragleave', e => { const col = e.target.closest('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
  q.addEventListener('drop', e => {
    const col = e.target.closest('.col'); if (!col) return; e.preventDefault();
    const id = e.dataTransfer.getData('text/plain') || arrastando, t = S.tarefas.get(id);
    arrastando = null; col.classList.remove('over');
    if (t && stOk(t.status) !== col.dataset.st) mudarStatus(t, col.dataset.st); else agendar();
  });

  const cal = $('#cal');
  cal.addEventListener('click', e => {
    const g = s => e.target.closest(s); let el;
    if ((el = g('[data-mes]'))) {
      const k = +el.dataset.mes;
      if (!k) { S.mes = hojeYmd().slice(0, 7); S.diaSel = hojeYmd(); } else { const [y, mm] = S.mes.split('-').map(Number); S.mes = ymd(new Date(y, mm - 1 + k, 1)).slice(0, 7); }
      S.dpAberto = false; agendar();
    } else if ((el = g('[data-abrir-id]'))) abrirTarefa(el.dataset.abrirId);
    else if ((el = g('[data-nova-dia]'))) {
      const dia = el.dataset.novaDia, dt = datasDoAno(+dia.slice(0, 4)).filter(x => x.ymd === dia && x.tipo !== 'campanha')[0];
      abrirNova(dt ? { data: dia, ocasiaoId: dt.id, ocasiao: dt.nome } : { data: dia });
    } else if ((el = g('[data-criar-emp]'))) {
      const dt = dataPorId(el.dataset.criarDt); if (dt) abrirNova({ empresaId: el.dataset.criarEmp, ocasiaoId: dt.id, ocasiao: dt.nome, data: dt.ymd });
    } else if ((el = g('[data-del-data]'))) { const id = el.dataset.delData; armar(el, 'Remover?', () => gravar('datas', id, 'delete').then(ok => ok && toast('Data removida.'))); }
    else if ((el = g('.dia')) && !g('button')) { S.diaSel = el.dataset.dia; if (S.diaSel.slice(0, 7) !== S.mes) S.mes = S.diaSel.slice(0, 7); S.dpAberto = false; agendar(); }
  });
  cal.addEventListener('keydown', e => { if (e.target.classList.contains('dia') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.click(); } });
  cal.addEventListener('submit', e => {
    if (e.target.id !== 'dp-form') return; e.preventDefault();
    const n = $('#dp-nome').value.trim(); if (!n) { $('#dp-nome').focus(); return; }
    gravar('datas', novoId(), 'set', { nome: n, data: S.diaSel, anual: $('#dp-anual').checked, empresaId: $('#dp-emp').value || '', criadoPor: eu(), criadoEm: Date.now() }).then(ok => ok && toast('Data marcada no calendário.'));
    S.dpAberto = false; $('#dp-nome').blur(); agendar();
  });

  document.addEventListener('click', e => {
    const qb = e.target.closest('[data-quem]');
    if (qb) { S.eu = qb.dataset.quem; gravarLS('pauta:eu', S.eu); fecharModal(); agendar(); toast(`Olá, ${nome(S.eu)}!`); return; }
    const a = e.target.closest('[data-acao]'); if (!a) return;
    const k = a.dataset.acao;
    if (k === 'limpar') { S.filtro = 'todas'; S.fEmp = ''; S.busca = ''; $('#f-busca').value = ''; agendar(); }
    else if (k === 'calendario') irPara('calendario');
    else if (k === 'dp-abrir') { S.dpAberto = true; agendar(); setTimeout(() => { const i = $('#dp-nome'); if (i) i.focus(); }, 60); }
    else if (k === 'dp-fechar') { S.dpAberto = false; agendar(); }
    else if (k === 'trocar') { fecharDrawer(); mostrarQuem(true); }
    else if (k === 'fechar-modal') fecharModal();
    else if (k === 'avisos') ativarAvisos();
    else if (k === 'csv') baixarCsv();
    else if (k === 'sair') { gravarLS('pauta:senha', null); location.reload(); }
    else if (k === 'recarregar') location.reload();
  });

  $('#scrim').addEventListener('click', fecharDrawer);
  $('#dr-fechar').addEventListener('click', fecharDrawer);
  $('#t-cancelar').addEventListener('click', fecharDrawer);
  $('#t-criar').addEventListener('click', criarDoDrawer);
  const f = $('#form-tarefa');
  f.addEventListener('submit', e => { e.preventDefault(); if (S.drawer === 'nova') criarDoDrawer(); });
  f.addEventListener('change', e => { if (e.target.name) campoMudou(e.target.name, e.target.value); });
  let deb = 0;
  f.addEventListener('input', e => {
    const el = e.target;
    if (el.name === 't-prazo') drawerVivo();
    if (S.drawer === 'editar' && /^t-(demanda|obs|link|outra)$/.test(el.name)) { clearTimeout(deb); deb = setTimeout(() => campoMudou(el.name, el.value), 700); }
  });
  $('#t-demanda').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (S.drawer === 'nova') criarDoDrawer(); else e.target.blur(); } });
  $('#t-atalhos').addEventListener('click', e => { const b = e.target.closest('[data-ms]'); if (!b) return; $('#t-prazo').value = paraInputDT(+b.dataset.ms); campoMudou('t-prazo', $('#t-prazo').value); });
  $('#t-sw-btn').addEventListener('click', () => { const t = S.tarefas.get(S.editando); if (t) alternarCrono(t); });
  $('#t-excluir').addEventListener('click', e => {
    const t = S.tarefas.get(S.editando); if (!t) return;
    armar(e.currentTarget, 'Confirmar exclusão', () => {
      const { id, ...resto } = t; fecharDrawer();
      gravar('tarefas', id, 'delete').then(ok => ok && toast('Demanda excluída.', 'Desfazer', () => gravar('tarefas', id, 'set', resto)));
    });
  });

  const aj = $('#ajustes');
  aj.addEventListener('change', e => {
    const el = e.target, campo = el.dataset.campo; if (!campo) return;
    const le = el.closest('[data-emp]'), lp = el.closest('[data-pes]'), col = le ? 'empresas' : lp ? 'equipe' : null; if (!col) return;
    const id = le ? le.dataset.emp : lp.dataset.pes, atual = S[col].get(id); if (!atual) return;
    const v = el.value.trim(); if (campo === 'nome' && !v) { el.value = atual.nome; return; }
    if ((atual[campo] || '') !== v) gravar(col, id, 'update', { [campo]: v });
  });
  aj.addEventListener('submit', e => {
    const fm = e.target.closest('[data-form]'); if (!fm) return; e.preventDefault();
    const n = fm.elements.nome.value.trim(); if (!n) { fm.elements.nome.focus(); return; }
    const col = fm.dataset.form === 'emp' ? 'empresas' : 'equipe', ordem = Math.max(0, ...[...S[col].values()].map(x => x.ordem || 0)) + 1;

  });
  aj.addEventListener('click', e => {
    const de = e.target.closest('[data-del-emp]'), dp = e.target.closest('[data-del-pes]');

      const id = de.dataset.delEmp, n = [...S.tarefas.values()].filter(t => t.empresaId === id).length;

    } else if (dp) {

    }
  });

  $('#modal').addEventListener('submit', e => {
    if (e.target.id !== 'form-senha') return; e.preventDefault();

  });
  $('#pill-btn').addEventListener('click', () => { const t = S.tarefas.get($('#pill').dataset.id); if (t) alternarCrono(t); });
  $('#pill-tit').addEventListener('click', () => { const id = $('#pill').dataset.id; if (id) abrirTarefa(id); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (POP) fecharPop(true); else if (S.drawer) fecharDrawer(); else if (modalTipo === 'quem' && eu()) fecharModal();
      return;
    }
    const alvo = e.target;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(alvo.tagName) || alvo.isContentEditable || e.ctrlKey || e.metaKey || e.altKey || S.drawer || modalTipo) return;
    if (e.key === 'n' || e.key === 'N' || e.key === '/') { e.preventDefault(); $('#qa-input').focus(); }
    else if (e.key === '1') irPara('lista'); else if (e.key === '2') irPara('quadro'); else if (e.key === '3') irPara('calendario');
  });
  window.addEventListener('hashchange', rota);
}
function iniciar() {
  ligarUI();
  const v0 = location.hash.slice(1), salvo0 = lerLS('pauta:vista');
  S.vista = VISTAS.includes(v0) ? v0 : VISTAS.includes(salvo0) ? salvo0 : 'lista';
  agendar(); setInterval(tique, 1000); B.conectar();
}
iniciar();
})();
